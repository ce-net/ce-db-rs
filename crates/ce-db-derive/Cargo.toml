[package]
name = "ce-db-derive"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "#[derive(Record)] for ce-db: one Rust struct is the schema of a state.store collection"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
